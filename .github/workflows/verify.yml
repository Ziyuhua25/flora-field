name: Verify FLORA / FIELD
on:
  push:
    branches: [upgrade-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node geometry-test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flora-field-browser-results
          path: qa-results/
          if-no-files-found: ignore
